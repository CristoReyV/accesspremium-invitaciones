# ============================================================
# Netlify Configuration — AccessPremium Invitaciones
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — todas las rutas no-asset sirven index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================
# Edge Functions
# ============================================================

# Social meta injection — must run before SPA fallback
[[edge_functions]]
  function = "invitation-social-meta"
  path = "/*"
