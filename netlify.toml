# ============================================================
# Netlify Configuration
# AccessPremium Invitaciones
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Social meta injection edge function
[[edge_functions]]
  function = "invitation-social-meta"
  path = "/*"
